appId: com.codingusagedashboard.app
productName: Coding Usage Dashboard
copyright: Copyright © 2026 funzza

directories:
  output: dist

# 只打构建产物;ccusage 等数据源是运行时外部依赖,不入包
files:
  - out/**
  - package.json

win:
  target: nsis
  icon: resources/icon.png
  artifactName: ${name}-setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  shortcutName: Coding Usage Dashboard

publish:
  provider: github
  owner: funzza
  repo: coding-usage-dashboard
  releaseType: draft
