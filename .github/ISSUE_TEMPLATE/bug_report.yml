name: Bug report
description: Something in the desktop app is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For ccusage CLI bugs, open an issue on [ccusage](https://github.com/ccusage/ccusage) instead.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: ccusage
    attributes:
      label: ccusage version (`ccusage --version`)
      placeholder: 20.0.20
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: settings
    attributes:
      label: Settings page source statuses
      description: Paste the source rows from Settings (ccusage / WSL / ZCode / DSH / Qoder). Do not paste tokens.
